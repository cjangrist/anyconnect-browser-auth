User tinyproxy
Group tinyproxy
Port 8080
Listen 0.0.0.0
Timeout 60
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatHost "tinyproxy.health"
StatFile "/usr/share/tinyproxy/stats.html"
LogLevel Critical
MaxClients 1024
ViaProxyName "anyconnect-vpn-proxy"

# No Allow or BasicAuth directives: every reachable client is accepted without
# credentials. Rootless Docker rewrites every published-port source address to the
# bridge gateway, so client filtering has to happen at the published host address
# (VPN_PROXY_HOST_IP, default 127.0.0.1) rather than here.
