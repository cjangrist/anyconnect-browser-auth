User tinyproxy
Group tinyproxy
Port 8080
Listen 0.0.0.0
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatHost "tinyproxy.health"
StatFile "/usr/share/tinyproxy/stats.html"
LogLevel Warning
MaxClients 100
ViaProxyName "anyconnect-vpn-proxy"

# No Allow or BasicAuth directives: every reachable client is accepted without credentials.
