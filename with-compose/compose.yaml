services:
  vpn:
    build:
      context: .
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - KILL
      - NET_ADMIN
      - SETGID
      - SETUID
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - name: http-proxy
        target: 8080
        published: "8080"
        host_ip: 0.0.0.0
        protocol: tcp
      - name: socks5-proxy
        target: 1080
        published: "1080"
        host_ip: 0.0.0.0
        protocol: tcp
    environment:
      - VPN_BROWSER_HEADLESS
      - VPN_PASSWORD
      - VPN_SERVER
      - VPN_TOTP_SECRET
      - VPN_USERNAME
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "/app/vpn.js", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
