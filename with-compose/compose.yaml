services:
  vpn:
    build:
      context: .
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_BROWSER_HEADLESS
      - VPN_PASSWORD
      - VPN_SERVER
      - VPN_TOTP_SECRET
      - VPN_USERNAME
    volumes:
      - type: volume
        source: vpn-runtime
        target: /run/vpn-sidecar
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "/app/vpn.js", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

  through-vpn:
    build:
      context: .
    entrypoint: ["/usr/bin/tini", "--", "/app/vpn.js", "probe"]
    restart: unless-stopped
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    volumes:
      - type: volume
        source: vpn-runtime
        target: /run/vpn-sidecar
        read_only: true
    healthcheck:
      test: ["CMD", "/app/vpn.js", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  vpn-runtime:
