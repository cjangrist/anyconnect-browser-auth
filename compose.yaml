services:
  vpn:
    image: ghcr.io/cjangrist/anyconnect-browser-auth:latest
    pull_policy: always
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - KILL
      - NET_ADMIN
      - SETGID
      - SETUID
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - name: http-proxy
        target: 8080
        published: "8080"
        host_ip: 0.0.0.0
        protocol: tcp
      - name: socks5-proxy
        target: 1080
        published: "1080"
        host_ip: 0.0.0.0
        protocol: tcp
    environment:
      - VPN_PASSWORD
      - VPN_SERVER
      - VPN_TOTP_SECRET
      - VPN_USERNAME
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "/app/vpn.js", "healthcheck"]
      interval: ${VPN_HEALTHCHECK_INTERVAL:-15s}
      timeout: ${VPN_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${VPN_HEALTHCHECK_RETRIES:-8}
      start_period: ${VPN_HEALTHCHECK_START_PERIOD:-90s}
